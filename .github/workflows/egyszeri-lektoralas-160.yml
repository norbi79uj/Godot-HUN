name: "Egyszeri 160-as PR lektoralasi javitas"
on:
  push:
    branches:
      - "i18n/f1-skeleton-modifiers-physics-profiles-20261123"
    paths:
      - ".github/workflows/egyszeri-lektoralas-160.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Harom biztonsagos szovegpontositas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ("msgstr \"Ez a [SkeletonModification2D] a megadott cél felé fordítja a csontot. Használhatod például arra, hogy egy karakter feje kövesse a játékost, vagy hogy egy forgatható csomópont a kijelölt cél felé nézzen.\"", "msgstr \"Ez a [SkeletonModification2D] a megadott cél felé fordítja a csontot. Használhatod például arra, hogy egy karakter feje kövesse a játékost, vagy hogy egy lövegtorony a kijelölt célpontra forduljon.\""),
              ("msgstr \"A PhysicalBone3D szögsebessége másodpercenkénti [i]radiánban[/i].\"", "msgstr \"A PhysicalBone3D szögsebessége [i]radián[/i]/másodpercben (rad/s).\""),
              ("msgstr \"Annak a csontnak a neve, amelynek magasságából a motor kiszámítja a mozgás méretének normalizálásához használt tényezőt. A [SkeletonProfileHumanoid] például a [code]Hips[/code] csontot használja.\"", "msgstr \"Annak a csontnak a neve, amelynek a modellben elfoglalt magassági helyzetét a motor a mozgás méretarányának normalizálásához használja. A [SkeletonProfileHumanoid] például a [code]Hips[/code] csontot használja.\""),
          ]
          for original, revised in replacements:
              if s.count(original) != 1: raise RuntimeError("Eltérő forrás, megállítás: " + original[:70])
              s = s.replace(original, revised)
          p.write_text(s, encoding="utf-8")
          Path(".github/workflows/egyszeri-lektoralas-160.yml").unlink()
          PY
      - name: PO es forditasi ellenorzes
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gettext
          python3 -m unittest discover -s forditas -p 'test_*.py' -v
          python3 forditas/ellenorzes.py --require-msgfmt
          git diff --check
      - name: Harom javitas commitolasa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po" ".github/workflows/egyszeri-lektoralas-160.yml"
          git commit -m "Lektorálás: három magyar pontosítás a #160 PR-ben"
          git push origin HEAD:i18n/f1-skeleton-modifiers-physics-profiles-20261123
