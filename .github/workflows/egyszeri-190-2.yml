name: Egyszeri 190-es két XR-leírás javítása
on:
  push:
    branches:
      - 'i18n/f1-pr190-kihagyott-2-javitas-20261127'
    paths:
      - '.github/workflows/egyszeri-190-2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Két új PO-bejegyzés hozzáadása
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po")
          addition = json.loads(r'''"#: modules/openxr/doc_classes/OpenXRVisibilityMask.xml\nmsgid \"The visibility mask allows us to black out the part of the render result that is invisible due to lens distortion.\\n\\t\\tAs this is rendered first, it prevents fragments with expensive lighting calculations to be processed as they are discarded through z-checking.\"\nmsgstr \"A láthatósági maszk segítségével elfedhetők a lencsetorzítás miatt nem látható képrészek. A csomópont az OpenXR XR_KHR_visibility_mask bővítményéből származó, rejtett területeket leíró háromszöghálót használja, ha a bővítmény elérhető; szülőjeként XRCamera3D csomópontot igényel. A maszk a nem látható képrészek feldolgozását csökkentheti a mélységvizsgálat révén, de a tényleges renderelési sorrend és a teljesítménynyereség a renderelési beállításoktól függ.\"\n\n#: doc/classes/XRHandTracker.xml\nmsgid \"The source of hand tracking data is unobstructed, meaning that an accurate method of hand tracking is used. These include optical hand tracking, data gloves, etc.\"\nmsgstr \"A kézkövetési adatok akadálytalan forrásból származnak, például optikai kézkövetésből vagy adatkesztyűből. Ez a felsorolási érték az adatforrás típusát jelöli; önmagában nem garantálja az ízületi adatok pontosságát vagy érvényességét. Az érvényességet külön követési jelzők mutatják.\"\n\n"''')
          old = p.read_text(encoding="utf-8")
          assert old.endswith("\n")
          assert addition.count("\nmsgid ") == 2
          for block in addition.strip().split("\n\n"):
              msgid = block.split("\nmsgid ", 1)[1].split("\nmsgstr ", 1)[0]
              assert "\nmsgid " + msgid + "\n" not in old, "Ismételt angol leírás"
          p.write_text(old + "\n" + addition.rstrip("\n") + "\n", encoding="utf-8")
          PY
      - name: Regressziós és gettext-ellenőrzés
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gettext
          python3 -m unittest discover -s forditas -p 'test_*.py' -v
          python3 forditas/ellenorzes.py --require-msgfmt
          git diff --check
      - name: Javítás rögzítése és az egyszeri workflow eltávolítása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po
          git rm .github/workflows/egyszeri-190-2.yml
          git commit -m "Godot F1: két kihagyott OpenXR leírás pontosítása"
          git push
