name: Egyszeri vizuálisshader-súgólektorálás
on:
  push:
    branches:
      - i18n/f1-visual-shader-human-review-20261122
permissions:
  contents: write
jobs:
  javitas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Katalógus letöltése
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Öt ellenőrzött magyar szöveg javítása
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, re
          path = Path("forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po")
          data = path.read_text(encoding="utf-8")
          assert "\r" not in data
          lines = data.splitlines(keepends=True)
          updated = json.loads(r'''{"VisualShader.disconnect_nodes":"Megszünteti a megadott csomópontok portjai közötti kapcsolatot.","VisualShaderNodeIf.description":"A csomópontnak hat bemenete van:\n- Az [b]1[/b]. és [b]2[/b]. porton kapja az összehasonlítandó [code]a[/code] és [code]b[/code] lebegőpontos számokat.\n- A [b]3[/b]. porton állíthatod be a tűréshatárt, amelyen belül a két szám egyenlőnek számít.\n- Ha [code]a == b[/code], a [b]4[/b]. port értékét adja ki; ha [code]a > b[/code], az [b]5[/b]. portét; ha [code]a < b[/code], a [b]6[/b]. portét.","VisualShaderNodeFrame.description":"Téglalap alakú keret a vizuális shadercsomópontok csoportosításához.\nHa elhúzod a keretet, a hozzá csatolt csomópontok is vele mozognak. A keret szükség esetén automatikusan úgy méreteződik, hogy mindegyik beleférjen.\nA cím, a leírás és a szín testreszabható.","VisualShaderNodeInput.input_type_changed":"A csomópont akkor küldi ezt a jelet, amikor a [member input_name] megváltoztatásával másik bemenetre váltasz."}''')
          name = ""
          found = []
          for i, line in enumerate(lines):
              if line.startswith("#. "):
                  name = line[3:].strip()
              if not line.startswith("msgstr "):
                  continue
              if name not in updated and name != "VisualShaderNodeColorFunc.FUNC_LINEAR_TO_SRGB":
                  continue
              old = json.loads(line[7:].strip())
              if name in updated:
                  new = updated[name]
              else:
                  fragment = "amely negatív bemeneteknél nem meghatározott eredményt adhat:"
                  assert old.count(fragment) == 1, name
                  new = old.replace(fragment, "amely negatív bemeneteknél nem meghatározott működéshez vezethet:")
              tags = lambda s: Counter(re.findall(r"\[[^\]]+\]", s))
              assert tags(old) == tags(new), name
              assert name not in found, name
              lines[i] = "msgstr " + json.dumps(new, ensure_ascii=False) + "\n"
              found.append(name)
          assert len(found) == 5, found
          new_data = "".join(lines)
          assert data.count("\nmsgid ") == new_data.count("\nmsgid ")
          assert data.count("\nmsgstr ") == new_data.count("\nmsgstr ")
          path.write_text(new_data, encoding="utf-8", newline="")
          print("Öt célzott magyar msgstr javítva:", ", ".join(found))
          PY
      - name: gettext telepítése
        run: sudo apt-get update -qq && sudo apt-get install -y gettext
      - name: Regressziós és PO-ellenőrzés
        run: |
          python3 -m unittest discover -s forditas -p 'test_*.py' -v
          python3 forditas/ellenorzes.py --require-msgfmt
          for f in forditas/ellenorzes_lektoralt*.py; do python3 "$f"; done
          git diff --check
      - name: Javítás mentése a külön ágra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-visual-shader-review.yml
          git add forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po
          git diff --cached --check
          git commit -m "Öt vizuálisshader-súgóbejegyzés természetes magyar lektorálása"
          git push origin HEAD:i18n/f1-visual-shader-human-review-20261122
