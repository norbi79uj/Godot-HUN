name: "Egyszeri #165 két F1 lektorálási javítás"
on:
  push:
    branches:
      - "i18n/f1-camera-environment-render-settings-20261124"
    paths:
      - ".github/workflows/egyszeri-165-ket-lektoralasi-javitas.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Két megjelölt magyar fordítás javítása
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path("forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po")
          wf = Path(".github/workflows/egyszeri-165-ket-lektoralasi-javitas.yml")
          s = p.read_text(encoding='utf-8')
          original = s
          blob_sha = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
          assert blob_sha == '3f0883eb394e3879bdb280d42ef4158acc16d2a6', 'PO-fajl eltér a jóváhagyott kiindulási állapottól'
          fixes = [
            ("msgstr \"Ha az érték [code]true[/code], a motor fél felbontásban számítja ki a képernyőtérbeli tükröződéseket, majd a jelenethez adás előtt felnagyítja őket. Ez gyorsabb, de képpontosságot vagy villódzást okozhat. [code]false[/code] értéknél a tükröződések teljes felbontásban készülnek.\"", "msgstr \"Ha az érték [code]true[/code], a motor fél felbontásban számítja ki a képernyőtérbeli tükröződéseket, majd a jelenethez adás előtt felnagyítja őket. Ez gyorsabb, de pixelesedést vagy villódzást okozhat. [code]false[/code] értéknél a tükröződések teljes felbontásban készülnek.\""),
            ("msgstr \"Az irányított fény árnyéktérképének mérete képpontban. Nagyobb értéknél élesebbek az árnyékok, de lassabb a megjelenítés. A motor az értéket felfelé kerekíti kettő legközelebbi hatványára.\"", "msgstr \"Az irányított fény árnyéktérképének mérete képpontban. Nagyobb értéknél élesebbek az árnyékok, de lassabb a megjelenítés. A motor az értéket felfelé kerekíti a legközelebbi kettőhatványra.\""),
          ]
          for before, after in fixes:
              assert s.count(before) == 1, 'Hibás vagy többszörös régi fordítás'
              s = s.replace(before, after)
          assert original.count('\nmsgid ') == s.count('\nmsgid '), 'Az angol kulcsok nem módosulhatnak'
          assert original.count('\n') == s.count('\n'), 'Sorszámváltozás'
          assert len(fixes) == 2
          p.write_text(s, encoding='utf-8')
          wf.unlink()
          PY
      - name: PO-, regressziós és diffellenőrzés
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gettext
          python3 -m unittest discover -s forditas -p 'test_*.py' -v
          python3 forditas/ellenorzes.py --require-msgfmt
          git diff --check
          test "$(git diff --numstat -- forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po)" = "$(printf '2\t2\tforditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po')"
      - name: Ellenőrzött fordítások commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po" ".github/workflows/egyszeri-165-ket-lektoralasi-javitas.yml"
          git commit -m "Godot F1: két jóváhagyott nyelvi pontosítás a #165 PR-ben"
          git push origin HEAD:i18n/f1-camera-environment-render-settings-20261124

