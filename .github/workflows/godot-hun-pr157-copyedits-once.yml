name: Egyszeri Godot-HUN lektorálási javítás (157 és 158)

on:
  push:
    branches:
      - i18n/f1-audio-input-file-formats-20261123
    paths:
      - '.github/workflows/godot-hun-pr157-copyedits-once.yml'

permissions:
  contents: write

jobs:
  copyedit-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: i18n/f1-audio-input-file-formats-20261123
          persist-credentials: true
      - name: GNU gettext telepítése
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: Három javítás mindkét ágon, helyi regressziós tesztekkel és öneltávolítással
        shell: bash
        run: |
          set -euo pipefail
          BR157="i18n/f1-audio-input-file-formats-20261123"
          BR158="i18n/f1-animation-blend-state-machines-20261123"
          PO="forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po"
          SELF=".github/workflows/godot-hun-pr157-copyedits-once.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for BR in "$BR157" "$BR158"; do
            echo "::group::Javítás és ellenőrzés: $BR"
            git fetch origin "refs/heads/$BR:refs/remotes/origin/$BR"
            git checkout -B "$BR" "origin/$BR"
            if [[ "$BR" == "$BR157" ]]; then
              test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "A #157 ág időközben módosult"; exit 1; }
            else
              test "$(git rev-parse HEAD)" = "6d83dac42021532078787bc6cf7a368b1e6490c4" || { echo "A #158 ág időközben módosult"; exit 1; }
            fi
            python3 - <<'PY'
          from pathlib import Path
          p = Path("forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po")
          raw = p.read_bytes()
          original = raw.decode("utf-8")
          edits = [
              ("A hangsáv egy ütemére jutó ütések száma.", "Az ütések száma egy ütemben."),
              ("Az [code]index[/code] helyen lévő [AudioStream] hangfolyam.", "Az [code]index[/code] sorszámú [AudioStream] hangfolyam."),
              ("Az [code]index[/code] helyen lévő [AudioStream] kiválasztásának valószínűségi súlya.", "Az [code]index[/code] sorszámú [AudioStream] kiválasztásának valószínűségi súlya."),
          ]
          s = original
          for old, new in edits:
              assert s.count(old) == 1 and s.count(new) == 0, f"Nem egyedi vagy mar elvegzett modositas: {old}"
              s = s.replace(old, new, 1)
          assert s.count("\n") == original.count("\n")
          assert s.replace(edits[0][1], edits[0][0], 1).replace(edits[1][1], edits[1][0], 1).replace(edits[2][1], edits[2][0], 1) == original
          p.write_bytes(s.encode("utf-8"))
          print("Pontosan 3 lektorálási módosítás alkalmazva, egyéb tartalom változatlan.")
          PY
            git diff --check
            python3 -m unittest discover -s forditas -p 'test_*.py' -v
            python3 forditas/ellenorzes.py --require-msgfmt
            for n in 10 11 12 13 14 15 16 17; do
              if [[ "$n" == "10" ]]; then python3 forditas/ellenorzes_lektoralt.py; else python3 "forditas/ellenorzes_lektoralt_$n.py"; fi
            done
            if [[ "$BR" == "$BR157" ]]; then
              git rm -- "$SELF"
            fi
            git add -- "$PO"
            git diff --cached --check
            git commit -m "Lektorálás: három jóváhagyott F1-súgópontosítás (#157)"
            git push origin "HEAD:refs/heads/$BR"
            echo "::endgroup::"
          done
