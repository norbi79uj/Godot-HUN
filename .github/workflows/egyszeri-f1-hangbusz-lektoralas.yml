name: Egyszeri F1 hangbusz szövegjavítás
on:
  push:
    branches:
      - i18n/f1-audioserver-interactive-music-20261123
    paths:
      - .github/workflows/egyszeri-f1-hangbusz-lektoralas.yml
permissions:
  contents: write
jobs:
  lektoralas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/f1-audioserver-interactive-music-20261123
      - name: Négy közös getter/setter leírás javítása
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po')
          original = p.read_bytes()
          updated = original
          pairs = [["A [code]true[/code] visszatérési érték azt jelzi, hogy a [param bus_idx] indexű hangbusz megkerüli az effektjeit.","A [code]true[/code] érték esetén a [param bus_idx] indexű hangbusz megkerüli az effektjeit."],["A [code]true[/code] visszatérési érték azt jelzi, hogy a [param bus_idx] indexű hangbusz [param effect_idx] indexű effektje engedélyezve van.","A [code]true[/code] érték esetén a [param bus_idx] indexű hangbusz [param effect_idx] indexű effektje engedélyezve van."],["A [code]true[/code] visszatérési érték azt jelzi, hogy a [param bus_idx] indexű hangbusz el van némítva.","A [code]true[/code] érték esetén a [param bus_idx] indexű hangbusz el van némítva."],["A [code]true[/code] visszatérési érték azt jelzi, hogy a [param bus_idx] indexű hangbusz szóló módban van.","A [code]true[/code] érték esetén a [param bus_idx] indexű hangbusz szóló módban van."]]
          for old, new in pairs:
              before = ('msgstr "' + old + '"').encode('utf-8')
              after = ('msgstr "' + new + '"').encode('utf-8')
              assert updated.count(before) == 1, f'Eltérő forrás, hiányzó vagy ismételt rekord: {old[:60]}'
              updated = updated.replace(before, after)
          assert updated != original
          assert updated.count(b'\nmsgid ') == original.count(b'\nmsgid ')
          assert updated.count(b'\nmsgstr ') == original.count(b'\nmsgstr ')
          p.write_bytes(updated)
          print('4 közös getter/setter magyar szöveg javítva.')
          PY
          git diff --check
          git diff --stat
      - name: Javítás beküldése a PR ágára
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po
          git commit -m 'fix(i18n): hangbusz getter és setter szövegek pontosítása'
          git push origin HEAD:refs/heads/i18n/f1-audioserver-interactive-music-20261123
