name: Godot HUN 4.7.2 lektoralt 10 Windows teszt
on:
  push:
    paths:
      - '.github/workflows/godot-hu-lektoralt10-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-editor-build:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - name: Magyaritos projekt kinyerese
        uses: actions/checkout@v4

      - name: MSYS2 UCRT64 telepitese
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-scons

      - name: Godot 4.7.2-stable forras kinyerese es forditas elhelyezese
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch 4.7.2-stable https://github.com/godotengine/godot.git godot-source
          cp forditas/Godot_4_7_2_hu_LEKTORALT_10.po godot-source/doc/translations/hu.po
          test -s godot-source/doc/translations/hu.po

      - name: Godot Windows 64-bites editor forditasa
        shell: msys2 {0}
        working-directory: godot-source
        run: |
          scons platform=windows target=editor arch=x86_64 use_mingw=yes accesskit=no d3d12=no angle=no winrt=no -j2

      - name: Bin es licencek elokeszitese
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'Godot-HUN-4.7.2-Lektoralt10' | Out-Null
          $exe = Get-Item 'godot-source/bin/godot.windows.editor.x86_64.exe' -ErrorAction Stop
          if ($exe.Length -lt 30000000) { throw "Tul kicsi Godot editor EXE: $($exe.Length) byte" }
          if (-not $exe) { throw 'Nem keszult EXE a bin mappaban.' }
          Copy-Item $exe.FullName 'Godot-HUN-4.7.2-Lektoralt10/godot.windows.editor.x86_64.exe'
          Copy-Item 'godot-source/LICENSE.txt' 'Godot-HUN-4.7.2-Lektoralt10/LICENSE.txt'
          if (Test-Path 'godot-source/COPYRIGHT.txt') {
            Copy-Item 'godot-source/COPYRIGHT.txt' 'Godot-HUN-4.7.2-Lektoralt10/COPYRIGHT.txt'
          }
          Copy-Item 'LICENSE-TRANSLATIONS.txt' 'Godot-HUN-4.7.2-Lektoralt10/LICENSE-TRANSLATIONS.txt'
          Set-Content -Path 'Godot-HUN-4.7.2-Lektoralt10/OLVASS_EL.txt' -Encoding UTF8 -Value @(
            'Godot HUN 4.7.2 - Lektoralt 10 teszt',
            'Nem hivatalos, reszleges magyar F1-sugo.',
            'Ne irja felul a korabbi Godot telepitest.',
            'A teljes felulet / Inspector nem magyar.',
            'Forras: https://github.com/norbi79uj/Godot-HUN'
          )
          Compress-Archive -Path 'Godot-HUN-4.7.2-Lektoralt10' -DestinationPath 'Godot-HUN-4.7.2-Lektoralt10.zip' -Force
          if ((Get-Item 'Godot-HUN-4.7.2-Lektoralt10.zip').Length -lt 10000000) { throw 'Tul kicsi teszt ZIP, hibas csomagolas.' }
          (Get-FileHash 'Godot-HUN-4.7.2-Lektoralt10.zip' -Algorithm SHA256).Hash.ToLower() |
            Set-Content -Path 'Godot-HUN-4.7.2-Lektoralt10.sha256.txt'

      - name: Teszt csomag mentese (nem nyilvanos Release)
        uses: actions/upload-artifact@v4
        with:
          name: Godot-HUN-4.7.2-Lektoralt10
          path: |
            Godot-HUN-4.7.2-Lektoralt10.zip
            Godot-HUN-4.7.2-Lektoralt10.sha256.txt
          retention-days: 14
