name: Egyszeri 186-os kilenc XR-leírás javítása
on:
  push:
    branches:
      - 'i18n/f1-pr186-kihagyott-9-javitas-20261127'
    paths:
      - '.github/workflows/egyszeri-186-9.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A kilenc új PO-bejegyzés hozzáadása
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po")
          addition = json.loads(r'''"#: doc/classes/XRNode3D.xml\nmsgid \"Returns [code]true[/code] if the [member tracker] has been registered and the [member pose] is being tracked.\"\nmsgstr \"[code]true[/code] értéket ad vissza, ha a [member tracker] nevű követő regisztrálva van, és a [member pose] nevű póz szerepel a követő nyilvántartásában. Ez önmagában nem jelenti, hogy a pózhoz éppen érvényes követési adatok érkeznek.\"\n\n#: doc/classes/XRNode3D.xml\nmsgid \"Triggers a haptic pulse on a device associated with this interface.\\n[param action_name] is the name of the action for this pulse.\\n[param frequency] is the frequency of the pulse, set to [code]0.0[/code] to have the system use a default frequency.\\n[param amplitude] is the amplitude of the pulse between [code]0.0[/code] and [code]1.0[/code].\\n[param duration_sec] is the duration of the pulse in seconds.\\n[param delay_sec] is a delay in seconds before the pulse is given.\"\nmsgstr \"Haptikus impulzust kér a kiszolgáló elsődleges XR-interfészén keresztül, a csomópont követőnevével. Ha nincs elsődleges interfész, az impulzus kérése nem jut tovább.\\nA [param action_name] az impulzust kiváltó művelet neve.\\nA [param frequency] az impulzus frekvenciája; [code]0.0[/code] esetén a rendszer alapértelmezett frekvenciát használ.\\nA [param amplitude] az erősség [code]0.0[/code] és [code]1.0[/code] között.\\nA [param duration_sec] az időtartam másodpercben.\\nA [param delay_sec] a kezdés előtti késleltetés másodpercben.\"\n\n#: doc/classes/XRPositionalTracker.xml\nmsgid \"Returns [code]true[/code] if the tracker is available and is currently tracking the bound [param name] pose.\"\nmsgstr \"[code]true[/code] értéket ad vissza, ha a [param name] nevű póz szerepel a követő nyilvántartásában. A póz a követés átmeneti megszűnésekor is megmaradhat, ezért ez nem igazolja a pillanatnyi követési adatok érvényességét.\"\n\n#: doc/classes/XRPose.xml\nmsgid \"The transform containing the original and transform as reported by the XR runtime.\"\nmsgstr \"Az XR-futtatókörnyezet által szolgáltatott eredeti póztranszformáció, amely a követett helyzetet és tájolást tartalmazza, további igazítások alkalmazása előtt.\"\n\n#: modules/openxr/doc_classes/OpenXRAction.xml\nmsgid \"This resource defines an OpenXR action. Actions can be used both for inputs (buttons, joysticks, triggers, etc.) and outputs (haptics).\\nOpenXR performs automatic conversion between action type and input type whenever possible. An analog trigger bound to a boolean action will thus return [code]false[/code] if the trigger is depressed and [code]true[/code] if pressed fully.\\nActions are not directly bound to specific devices, instead OpenXR recognizes a limited number of top level paths that identify devices by usage. We can restrict which devices an action can be bound to by these top level paths. For instance an action that should only be used for hand held controllers can have the top level paths \\\"/user/hand/left\\\" and \\\"/user/hand/right\\\" associated with them. See the [url=https://www.khronos.org/registry/OpenXR/specs/1.0/html/xrspec.html#semantic-path-reserved]reserved path section in the OpenXR specification[/url] for more info on the top level paths.\\nNote that the name of the resource is used to register the action with.\"\nmsgstr \"Ez az erőforrás OpenXR-műveletet határoz meg. A műveletek bemenetekhez (gombok, analóg karok, elsütőbillentyűk stb.) és kimenetekhez (például haptikus visszajelzéshez) használhatók.\\nAz OpenXR, ahol lehetséges, automatikusan átalakítja a bemenet típusát a művelet típusára. Logikai művelethez rendelt analóg elsütőbillentyűnél a [code]false[/code] és [code]true[/code] érték közötti váltás az OpenXR átalakítási feltételeitől függ; ehhez nem feltétlenül kell teljesen lenyomni a billentyűt.\\nA műveletek nem közvetlenül egy konkrét eszközhöz kötődnek. Az OpenXR felső szintű útvonalakkal azonosítja az eszközök szerepét, és ezekkel korlátozható a hozzárendelhető eszközök köre. A kézben tartott vezérlőkhöz például a \\\"/user/hand/left\\\" és a \\\"/user/hand/right\\\" útvonal adható meg. További információt az OpenXR specifikáció [url=https://www.khronos.org/registry/OpenXR/specs/1.0/html/xrspec.html#semantic-path-reserved]fenntartott útvonalakról szóló része[/url] tartalmaz.\\nA művelet regisztrálásakor az erőforrás nevét használja a rendszer.\"\n\n#: modules/openxr/doc_classes/OpenXRAction.xml\nmsgid \"This action provides a float value between [code]0.0[/code] and [code]1.0[/code] for any analog input such as triggers.\"\nmsgstr \"Lebegőpontos értéket adó OpenXR-művelet analóg bemenetekhez, például elsütőbillentyűkhöz. Az értéktartomány a hozzárendelt bemeneti komponenstől függ: nem minden lebegőpontos bemenet értéke esik [code]0.0[/code] és [code]1.0[/code] közé.\"\n\n#: modules/openxr/doc_classes/OpenXRActionMap.xml\nmsgid \"OpenXR uses an action system similar to Godots Input map system to bind inputs and outputs on various types of XR controllers to named actions. OpenXR specifies more detail on these inputs and outputs than Godot supports.\\nAnother important distinction is that OpenXR offers no control over these bindings. The bindings we register are suggestions, it is up to the XR runtime to offer users the ability to change these bindings. This allows the XR runtime to fill in the gaps if new hardware becomes available.\\nThe action map therefore needs to be loaded at startup and can't be changed afterwards. This resource is a container for the entire action map.\"\nmsgstr \"Az OpenXR a Godot bemeneti művelettérképéhez hasonló rendszert használ az XR-vezérlők bemeneteinek és kimeneteinek elnevezett műveletekhez rendelésére. Az OpenXR a bemenetek és kimenetek részletesebb tulajdonságait is kezeli.\\nFontos különbség, hogy a regisztrált hozzárendelések csak javaslatok. Az XR-futtatókörnyezet biztosíthat lehetőséget a felhasználónak a hozzárendelések módosítására, és az új hardverek sajátosságait is kezelheti.\\nA művelettérképet a munkamenet inicializálásához be kell tölteni. A már létrehozott OpenXR-műveletek és hozzárendelések nem módosulnak automatikusan attól, hogy ezt az erőforrást futás közben átírod; a módosítások alkalmazásához újrainicializálás lehet szükséges. Ez az erőforrás a teljes művelettérképet foglalja össze.\"\n\n#: modules/openxr/doc_classes/OpenXRActionMap.xml\nmsgid \"Setup this action set with our default actions.\"\nmsgstr \"Létrehozza az alapértelmezett műveletkészletet és műveleteit, majd hozzáadja ehhez a művelettérképhez. A hozzájuk tartozó alapértelmezett interakciós profilokat és hozzárendeléseket is létrehozza.\"\n\n#: modules/openxr/doc_classes/OpenXRIPBinding.xml\nmsgid \"This binding resource binds an [OpenXRAction] to an input or output. As most controllers have left hand and right versions that are handled by the same interaction profile we can specify multiple bindings. For instance an action \\\"Fire\\\" could be bound to both \\\"/user/hand/left/input/trigger\\\" and \\\"/user/hand/right/input/trigger\\\". This would require two binding entries.\"\nmsgstr \"Ez az erőforrás egy [OpenXRAction] műveletet rendel bemeneti vagy kimeneti komponenshez. Mivel sok vezérlő bal és jobb kezes változata azonos interakciós profilt használ, több hozzárendelés is megadható. Például a \\\"Fire\\\" művelet a \\\"/user/hand/left/input/trigger/value\\\" és a \\\"/user/hand/right/input/trigger/value\\\" komponensútvonalhoz is hozzárendelhető. Ehhez két bejegyzés kell.\"\n\n"''')
          old = p.read_text(encoding="utf-8")
          assert old.endswith("\n")
          assert addition.count("\nmsgid ") == 9
          for block in addition.strip().split("\n\n"):
              msgid = block.split("\nmsgid ", 1)[1].split("\nmsgstr ", 1)[0]
              assert "\nmsgid " + msgid + "\n" not in old, "Ismételt angol leírás"
          p.write_text(old + "\n" + addition.rstrip("\n") + "\n", encoding="utf-8")
          PY
      - name: Regressziós és gettext-ellenőrzés
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gettext
          python3 -m unittest discover -s forditas -p 'test_*.py' -v
          python3 forditas/ellenorzes.py --require-msgfmt
          git diff --check
      - name: Javítás rögzítése és az egyszeri workflow eltávolítása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po
          git rm .github/workflows/egyszeri-186-9.yml
          git commit -m "Godot F1: kilenc kihagyott XR és OpenXR leírás pontosítása"
          git push
