name: Egyszeri 182-es tizenkét leírás javítása
on:
  push:
    branches:
      - 'i18n/f1-182-kihagyott-12-javitas-20261126'
    paths:
      - '.github/workflows/egyszeri-182-12.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Csak a 12 új PO-bejegyzés hozzáadása
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po")
          addition = json.loads(r'''"#: doc/classes/EditorInterface.xml\nmsgid \"Returns the name of the scene that is being played. If no scene is currently being played, returns an empty string.\"\nmsgstr \"Visszaadja a futtatott jelenet fájlútvonalát. Ha nincs futó jelenet, üres karakterláncot ad vissza.\"\n\n#: doc/classes/EditorInterface.xml\nmsgid \"Pops up an editor dialog for selecting properties from [param object]. The [param callback] must take a single argument of type [NodePath]. It is called on the selected property path (see [method NodePath.get_as_property_path]) or the empty path [code]^\\\"\\\"[/code] if the dialog is canceled. If [param type_filter] is provided, the dialog will only show properties that match one of the listed [enum Variant.Type] values. If [param current_value] is provided, the property will be selected automatically in the property list, if it exists.\\n[codeblock]\\nfunc _ready():\\n\\tif Engine.is_editor_hint():\\n\\t\\tEditorInterface.popup_property_selector(this, _on_property_selected, [TYPE_INT])\\n\\nfunc _on_property_selected(property_path):\\n\\tif property_path.is_empty():\\n\\t\\tprint(\\\"property selection canceled\\\")\\n\\telse:\\n\\t\\tprint(\\\"selected \\\", property_path)\\n[/codeblock]\"\nmsgstr \"Felugró szerkesztőablakot nyit a [param object] objektum tulajdonságának kiválasztásához. A [param callback] egyetlen [NodePath] típusú argumentumot fogad. A kiválasztott tulajdonság útvonalával hívódik meg (lásd a [method NodePath.get_as_property_path] metódust), a párbeszédablak megszakításakor az üres [code]^\\\"\\\"[/code] útvonallal. A [param type_filter] megadásával a lista a felsorolt [enum Variant.Type] típusokra szűkül. Ha a [param current_value] tulajdonság létezik, automatikusan kijelölődik.\\n[codeblock]\\nfunc _ready():\\n\\tif Engine.is_editor_hint():\\n\\t\\tEditorInterface.popup_property_selector(self, _on_property_selected, [TYPE_INT])\\n\\nfunc _on_property_selected(property_path):\\n\\tif property_path.is_empty():\\n\\t\\tprint(\\\"property selection canceled\\\")\\n\\telse:\\n\\t\\tprint(\\\"selected \\\", property_path)\\n[/codeblock]\"\n\n#: doc/classes/EditorPlugin.xml\nmsgid \"Called when there is a root node in the current edited scene, [method _handles] is implemented, and an [InputEvent] happens in the 2D viewport. If this method returns [code]true[/code], [param event] is intercepted by this [EditorPlugin], otherwise [param event] is forwarded to other Editor classes.\\n[codeblocks]\\n[gdscript]\\n# Prevents the InputEvent from reaching other Editor classes.\\nfunc _forward_canvas_gui_input(event):\\n\\treturn true\\n[/gdscript]\\n[csharp]\\n// Prevents the InputEvent from reaching other Editor classes.\\npublic override bool ForwardCanvasGuiInput(InputEvent @event)\\n{\\n\\treturn true;\\n}\\n[/csharp]\\n[/codeblocks]\\nThis method must return [code]false[/code] in order to forward the [InputEvent] to other Editor classes.\\n[codeblocks]\\n[gdscript]\\n# Consumes InputEventMouseMotion and forwards other InputEvent types.\\nfunc _forward_canvas_gui_input(event):\\n\\tif (event is InputEventMouseMotion):\\n\\t\\treturn true\\n\\treturn false\\n[/gdscript]\\n[csharp]\\n// Consumes InputEventMouseMotion and forwards other InputEvent types.\\npublic override bool _ForwardCanvasGuiInput(InputEvent @event)\\n{\\n\\tif (@event is InputEventMouseMotion)\\n\\t{\\n\\t\\treturn true;\\n\\t}\\n\\treturn false;\\n}\\n[/csharp]\\n[/codeblocks]\"\nmsgstr \"Akkor hívódik meg, ha a szerkesztett jelenetnek van gyökércsomópontja, a [method _handles] meg van valósítva, és [InputEvent] érkezik a 2D nézetablakba. Ha a metódus [code]true[/code] értéket ad vissza, az [param event] eseményt ez az [EditorPlugin] kezeli; különben az [param event] továbbjut a többi szerkesztőosztályhoz.\\n[codeblocks]\\n[gdscript]\\n# Megakadályozza, hogy az InputEvent eljusson a többi szerkesztőosztályhoz.\\nfunc _forward_canvas_gui_input(event):\\n\\treturn true\\n[/gdscript]\\n[csharp]\\n// Megakadályozza, hogy az [InputEvent] eljusson a többi szerkesztőosztályhoz.\\npublic override bool _ForwardCanvasGuiInput(InputEvent @event)\\n{\\n\\treturn true;\\n}\\n[/csharp]\\n[/codeblocks]\\nA továbbításhoz a metódusnak [code]false[/code] értéket kell visszaadnia.\\n[codeblocks]\\n[gdscript]\\n# Az InputEventMouseMotion eseményt kezeli, a többi típust továbbítja.\\nfunc _forward_canvas_gui_input(event):\\n\\tif (event is InputEventMouseMotion):\\n\\t\\treturn true\\n\\treturn false\\n[/gdscript]\\n[csharp]\\n// Az InputEventMouseMotion eseményt kezeli, a többi típust továbbítja.\\npublic override bool _ForwardCanvasGuiInput(InputEvent @event)\\n{\\n\\tif (@event is InputEventMouseMotion)\\n\\t{\\n\\t\\treturn true;\\n\\t}\\n\\treturn false;\\n}\\n[/csharp]\\n[/codeblocks]\"\n\n#: doc/classes/EditorPlugin.xml\nmsgid \"Override this method to provide a state data you want to be saved, like view position, grid settings, folding, etc. This is used when saving the scene (so state is kept when opening it again) and for switching tabs (so state can be restored when the tab returns). This data is automatically saved for each scene in an [code]editstate[/code] file in the editor metadata folder. If you want to store global (scene-independent) editor data for your plugin, you can use [method _get_window_layout] instead.\\nUse [method _set_state] to restore your saved state.\\n[b]Note:[/b] This method should not be used to save important settings that should persist with the project.\\n[b]Note:[/b] You must implement [method _get_plugin_name] for the state to be stored and restored correctly.\\n[codeblock]\\nfunc _get_state():\\n\\tvar state = { \\\"zoom\\\": zoom, \\\"preferred_color\\\": my_color }\\n\\treturn state\\n[/codeblock]\"\nmsgstr \"Írd felül ezt a metódust a mentendő állapotadatokhoz, például a nézet helyzetéhez, rácsbeállításokhoz vagy összecsukott elemekhez. Az állapot a jelenet mentésekor és lapváltáskor tárolódik, majd visszaállítható. A szerkesztő jelenetenként automatikusan az [code]editstate[/code] fájlba menti az adatokat a metaadatkönyvtárban. Jelenettől független állapothoz inkább a [method _get_window_layout] metódust használd.\\nA mentett állapotot a [method _set_state] állítja vissza.\\n[b]Megjegyzés:[/b] Ne itt tárold a projekttel együtt tartósan megőrzendő fontos beállításokat.\\n[b]Megjegyzés:[/b] Az állapot helyes mentéséhez és visszaállításához valósítsd meg a [method _get_plugin_name] metódust.\\n[codeblock]\\nfunc _get_state():\\n\\tvar state = { \\\"zoom\\\": zoom, \\\"preferred_color\\\": my_color }\\n\\treturn state\\n[/codeblock]\"\n\n#: doc/classes/EditorPlugin.xml\nmsgid \"Restore the state saved by [method _get_state]. This method is called when the current scene tab is changed in the editor.\\n[b]Note:[/b] Your plugin must implement [method _get_plugin_name], otherwise it will not be recognized and this method will not be called.\\n[codeblock]\\nfunc _set_state(data):\\n\\tzoom = data.get(\\\"zoom\\\", 1.0)\\n\\tpreferred_color = data.get(\\\"my_color\\\", Color.WHITE)\\n[/codeblock]\"\nmsgstr \"Visszaállítja a [method _get_state] metódussal mentett állapotot. A szerkesztő az aktív jelenetlap váltásakor hívja meg.\\n[b]Megjegyzés:[/b] A bővítményben valósítsd meg a [method _get_plugin_name] metódust, különben a szerkesztő nem ismeri fel a bővítményt, és ez a metódus nem hívódik meg.\\n[codeblock]\\nfunc _set_state(data):\\n\\tzoom = data.get(\\\"zoom\\\", 1.0)\\n\\tmy_color = data.get(\\\"preferred_color\\\", Color.WHITE)\\n[/codeblock]\"\n\n#: doc/classes/Area2D.xml\nmsgid \"Emitted when the received [param body] enters this area. [param body] can be a [PhysicsBody2D] or a [TileMap]. [TileMap]s are detected if their [TileSet] has collision shapes configured. Requires [member monitoring] to be set to [code]true[/code].\"\nmsgstr \"Akkor váltódik ki, amikor a [param body] test belép a területre. A [param body] lehet [PhysicsBody2D], [TileMap] vagy önálló TileMapLayer csomópont. A [TileMap] csempetérképek és az önálló csemperétegek akkor érzékelhetők, ha a [TileSet] erőforrásban ütközési alakzatok vannak beállítva. A [member monitoring] értéke legyen [code]true[/code].\"\n\n#: doc/classes/Area2D.xml\nmsgid \"Emitted when the received [param body] exits this area. [param body] can be a [PhysicsBody2D] or a [TileMap]. [TileMap]s are detected if their [TileSet] has collision shapes configured. Requires [member monitoring] to be set to [code]true[/code].\"\nmsgstr \"Akkor váltódik ki, amikor a [param body] test kilép a területről. A [param body] lehet [PhysicsBody2D], [TileMap] vagy önálló TileMapLayer csomópont. A [TileMap] csempetérképek és az önálló csemperétegek akkor érzékelhetők, ha a [TileSet] erőforrásban ütközési alakzatok vannak beállítva. A [member monitoring] értéke legyen [code]true[/code].\"\n\n#: doc/classes/Area2D.xml\nmsgid \"Emitted when a [Shape2D] of the received [param body] exits a shape of this area. [param body] can be a [PhysicsBody2D] or a [TileMap]. [TileMap]s are detected if their [TileSet] has collision shapes configured. Requires [member monitoring] to be set to [code]true[/code].\\nSee also [signal body_shape_entered].\"\nmsgstr \"Akkor váltódik ki, amikor a [param body] test egyik [Shape2D] alakzata kilép a terület egyik alakzatából. A [param body] lehet [PhysicsBody2D], [TileMap] vagy önálló TileMapLayer csomópont. A [TileMap] csempetérképek és az önálló csemperétegek akkor érzékelhetők, ha a [TileSet] erőforrásban ütközési alakzatok vannak beállítva. A [member monitoring] értéke legyen [code]true[/code].\\nLásd még a [signal body_shape_entered] jelzést.\"\n\n#: doc/classes/CollisionObject2D.xml\nmsgid \"Returns [code]true[/code] if collisions for the shape owner originating from this [CollisionObject2D] will not be reported to collided with [CollisionObject2D]s.\"\nmsgstr \"Visszaadja az alakzattulajdonos egyirányú ütközési jelzőjének állapotát. A [code]true[/code] azt jelenti, hogy a jelző engedélyezett. Ez nem az összes ütközés letiltását jelenti, hanem az ebből a [CollisionObject2D] csomópontból származó alakzatok más [CollisionObject2D] csomópontokkal végzett ütközéskezelését befolyásolja.\"\n\n#: doc/classes/CollisionObject2D.xml\nmsgid \"If [param enable] is [code]true[/code], collisions for the shape owner originating from this [CollisionObject2D] will not be reported to collided with [CollisionObject2D]s.\"\nmsgstr \"Ha a [param enable] értéke [code]true[/code], bekapcsolja az alakzattulajdonos egyirányú ütközési jelzőjét. Ez az ebből a [CollisionObject2D] csomópontból származó alakzatok más [CollisionObject2D] csomópontokkal való egyirányú ütközéskezelését szabályozza, nem minden ütközést tilt le.\"\n\n#: doc/classes/CollisionObject2D.xml\nmsgid \"Returns the child index of the [Shape2D] with the given ID from the given shape owner.\"\nmsgstr \"Visszaadja a megadott alakzattulajdonos shape_id azonosítójú [Shape2D] alakzatának az ütközési objektumon belüli indexét, nem pedig a jelenetfa gyermekindexét.\"\n\n#: doc/classes/TextureButton.xml\nmsgid \"Texture to display on mouse down over the node, if the node has keyboard focus and the player presses the Enter key or if the player presses the [member BaseButton.shortcut] key. If not assigned, the [TextureButton] displays [member texture_hover] instead when pressed.\"\nmsgstr \"Lenyomáskor megjelenítendő textúra. Egérrel való lenyomáskor, billentyűzettel fókuszált csomópont esetén Enter megnyomásakor vagy a [member BaseButton.shortcut] gyorsbillentyű használatakor jelenik meg. Ha nincs beállítva, a [TextureButton] a [member texture_hover] textúrát használja, és ha az sem létezik, a normál textúrát jeleníti meg.\"\n\n"''')
          old = p.read_text(encoding="utf-8")
          assert old.endswith("\n")
          assert addition.count("\nmsgid ") == 12
          for block in addition.strip().split("\n\n"):
              assert block.startswith("#: ")
              msgid = block.split("\nmsgid ", 1)[1].split("\nmsgstr ", 1)[0]
              assert "\nmsgid " + msgid + "\n" not in old, "Ismételt angol bejegyzés"
          p.write_text(old + "\n" + addition, encoding="utf-8")
          PY
      - name: Ellenőrzés
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gettext
          python3 -m unittest discover -s forditas -p 'test_*.py' -v
          python3 forditas/ellenorzes.py --require-msgfmt
          git diff --check
      - name: Javítás rögzítése és az egyszeri workflow eltávolítása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po
          git rm .github/workflows/egyszeri-182-12.yml
          git commit -m "Godot F1: tizenkét dokumentációs pontosítás a #182 után"
          git push
