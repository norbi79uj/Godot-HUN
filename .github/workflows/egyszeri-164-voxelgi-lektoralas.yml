name: "Egyszeri #164 VoxelGI fordítás pontosítás"
on:
  push:
    branches:
      - "i18n/f1-visual-shaders-lighting-20261124"
    paths:
      - ".github/workflows/egyszeri-164-voxelgi-lektoralas.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Négy lektorálási pontosítás
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path("forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po")
          s = p.read_text(encoding='utf-8')
          original = s
          sha = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
          assert sha == '33fd094bcc8e382d1ba40e92c3810d788be427de', 'Nem a jovahagyott kiindulasi PO-verzio'
          replacements = [
              ("msgstr \"64 részre osztja a rácsot.", "msgstr \"Tengelyenként 64 részre osztja a rácsot."),
              ("msgstr \"128 részre osztja a rácsot.", "msgstr \"Tengelyenként 128 részre osztja a rácsot."),
              ("msgstr \"256 részre osztja a rácsot.", "msgstr \"Tengelyenként 256 részre osztja a rácsot."),
              ("msgstr \"512 részre osztja a rácsot.", "msgstr \"Tengelyenként 512 részre osztja a rácsot."),
          ]
          for old, new in replacements:
              assert s.count(old) == 1, 'Nem egyedi fordítási sor: ' + old
              s = s.replace(old, new)
          assert original.count('\nmsgid ') == s.count('\nmsgid '), 'Váratlan msgid változás'
          assert original.count('\n') == s.count('\n'), 'Váratlan sorszám-változás'
          assert len(replacements) == 4
          p.write_text(s, encoding='utf-8')
          Path(".github/workflows/egyszeri-164-voxelgi-lektoralas.yml").unlink()
          PY
      - name: Ellenőrzések
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gettext
          python3 -m unittest discover -s forditas -p 'test_*.py' -v
          python3 forditas/ellenorzes.py --require-msgfmt
          git diff --check
          test "$(git diff --numstat -- forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po)" = "$(printf '4\t4\tforditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po')"
      - name: Csak az ellenőrzött módosítások commitolása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "forditas/Godot_4_7_2_hu_osszevont_munkavaltozat.po" ".github/workflows/egyszeri-164-voxelgi-lektoralas.yml"
          git commit -m "Godot F1: VoxelGI rácsfelosztás pontosítása tengelyenként (#164)"
          git push origin HEAD:i18n/f1-visual-shaders-lighting-20261124

